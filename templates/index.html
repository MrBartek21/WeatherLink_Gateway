<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeatherLink Gateway</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container-fluid p-3">
<header class="topbar mb-3">
  <div>
    <div class="eyebrow">WEATHERLINK</div>
    <h1><i class="bi bi-cloud-sun"></i> Gateway</h1>
  </div>
  <div class="status-pill"><span id="rxDot"></span><span id="rxStatus">NRF oczekuje</span></div>
</header>

<div id="message" class="alert d-none"></div>

<div class="row g-3">
  <div class="col-12 col-xl-8">
    <div id="nodeBlocks"></div>
  </div>

  <div class="col-12 col-xl-4">
    <section class="panel">
      <div class="panel-title"><span><i class="bi bi-broadcast"></i> NRF24</span></div>
      <div class="kv"><span>Adres</span><b id="nrfAddress">—</b></div>
      <div class="kv"><span>Kanał</span><b id="nrfChannel">—</b></div>
      <div class="kv"><span>Prędkość</span><b>250 KBPS</b></div>
      <div class="kv"><span>Payload</span><b>32 B</b></div>
      <div class="kv"><span>Moc</span><b id="nrfPower">—</b></div>
      <div class="kv"><span>ACK</span><b id="nrfAck">—</b></div>
    </section>

    <section class="panel mt-3">
      <div class="panel-title"><span><i class="bi bi-diagram-3"></i> MQTT</span><span id="mqttBadge" class="badge">—</span></div>
      <div class="kv"><span>Broker</span><b id="mqttBroker">—</b></div>
      <div class="kv"><span>Topic</span><b id="mqttTopic">—</b></div>
      <button class="btn btn-outline-info w-100 mt-3" onclick="mqttTest()"><i class="bi bi-send"></i> Wyślij test MQTT</button>
    </section>

    <section class="panel mt-3">
      <div class="panel-title"><span><i class="bi bi-display"></i> OLED</span><span id="oledBadge" class="badge">—</span></div>
      <div class="kv"><span>Stan</span><b id="oledState">—</b></div>
      <button class="btn btn-outline-light w-100 mt-3" onclick="oledTest()">Test OLED</button>
    </section>

    <section class="panel mt-3">
      <div class="panel-title"><span><i class="bi bi-sliders"></i> Konfiguracja</span></div>
      <button class="btn btn-primary w-100" onclick="openSettings()">Otwórz konfigurację</button>
    </section>
  </div>
</div>
</div>

<div class="modal fade" id="settingsModal" tabindex="-1">
<div class="modal-dialog modal-xl modal-dialog-scrollable">
<div class="modal-content">
<div class="modal-header"><h5 class="modal-title">WeatherLink Gateway — konfiguracja</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<form id="settingsForm">
<h6>NRF24</h6>
<div class="row g-2">
<div class="col-md-2"><label>CE GPIO<input class="form-control" id="ce" type="number"></label></div>
<div class="col-md-2"><label>CSN SPI<input class="form-control" id="csn" type="number"></label></div>
<div class="col-md-2"><label>Kanał<input class="form-control" id="channel" type="number"></label></div>
<div class="col-md-3"><label>Adres<input class="form-control" id="address" maxlength="5"></label></div>
<div class="col-md-3"><label>Moc<select class="form-select" id="power"><option value="0">MIN</option><option value="1">LOW</option><option value="2">HIGH</option><option value="3">MAX</option></select></label></div>
<div class="col-md-3 form-check form-switch mt-4 ms-2"><input class="form-check-input" id="autoAck" type="checkbox"><label class="form-check-label">Auto ACK</label></div>
</div>
<hr><h6>MQTT</h6>
<div class="row g-2">
<div class="col-md-2 form-check form-switch ms-2"><input class="form-check-input" id="mqttEnabled" type="checkbox"><label class="form-check-label">Włącz MQTT</label></div>
<div class="col-md-5"><label>Host<input class="form-control" id="mqttHost"></label></div>
<div class="col-md-2"><label>Port<input class="form-control" id="mqttPort" type="number"></label></div>
<div class="col-md-3"><label>Topic bazowy<input class="form-control" id="mqttTopicBase"></label></div>
<div class="col-md-4"><label>Użytkownik<input class="form-control" id="mqttUser"></label></div>
<div class="col-md-4"><label>Hasło<input class="form-control" id="mqttPass" type="password" placeholder="bez zmian"></label></div>
<div class="col-md-2"><label>QoS<select class="form-select" id="mqttQos"><option>0</option><option>1</option><option>2</option></select></label></div>
<div class="col-md-2 form-check form-switch mt-4"><input class="form-check-input" id="mqttRetain" type="checkbox"><label class="form-check-label">Retain</label></div>
</div>
<hr><h6>OLED</h6>
<div class="row g-2">
<div class="col-md-2 form-check form-switch ms-2"><input class="form-check-input" id="oledEnabled" type="checkbox"><label class="form-check-label">Włącz OLED</label></div>
<div class="col-md-2"><label>I2C bus<input class="form-control" id="oledBus" type="number"></label></div>
<div class="col-md-3"><label>Adres<input class="form-control" id="oledAddress"></label></div>
<div class="col-md-2"><label>Sekundy strony<input class="form-control" id="oledSeconds" type="number"></label></div>
<div class="col-md-3"><label>Wygaszacz po (s; 0 = wyłączony)<input class="form-control" id="oledSleep" type="number" min="0" max="3600"></label></div>
</div>
</form>
</div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button><button class="btn btn-primary" onclick="saveSettings()">Zapisz</button><button class="btn btn-outline-warning" onclick="restartGateway()">Zapisz i restartuj</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
